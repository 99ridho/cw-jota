<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f8eace" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Morse JOTA" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="Hear Morse code, pick a level, and decode mystery words. JOTA station mini-game." />
    <title>Morse Mini-Game</title>
    <script>
      // Apply the saved theme before first paint so dark players see no light flash.
      try {
        if (JSON.parse(localStorage.getItem('jota-morse')).theme === 'dark') {
          document.documentElement.dataset.theme = 'dark'
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#28241f')
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
